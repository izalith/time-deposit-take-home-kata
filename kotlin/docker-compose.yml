services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: timedeposits
      POSTGRES_USER: timedeposit
      POSTGRES_PASSWORD: timedeposit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timedeposit -d timedeposits"]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/timedeposits
      DB_USERNAME: timedeposit
      DB_PASSWORD: timedeposit
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  tests:
    image: maven:3.9-eclipse-temurin-17
    profiles: [test]
    working_dir: /app
    command: mvn -B verify
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - maven-repo:/root/.m2

volumes:
  maven-repo:
