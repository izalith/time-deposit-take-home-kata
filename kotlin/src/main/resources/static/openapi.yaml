openapi: 3.0.3
info:
  title: XA Bank Time Deposit API
  description: |
    Contract-first API for XA Bank time deposits.
    The server interface and DTOs are generated from this file (openapi-generator, kotlin-spring).
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local
tags:
  - name: TimeDeposits
    description: Time deposit operations
paths:
  /time-deposits:
    get:
      tags: [TimeDeposits]
      operationId: getTimeDeposits
      summary: Retrieve all time deposits
      description: Returns every time deposit together with its withdrawals.
      responses:
        '200':
          description: All time deposits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeDeposit'
  /time-deposits/balance-updates:
    post:
      tags: [TimeDeposits]
      operationId: updateBalances
      summary: Update the balances of all time deposits
      description: |
        Applies one month of interest to every time deposit and persists the new balances.
        Modelled as POST of a "balance update" run because the operation is not idempotent:
        each call adds another month of interest.
      responses:
        '204':
          description: Balances updated
components:
  schemas:
    TimeDeposit:
      type: object
      required: [id, planType, balance, days, withdrawals]
      properties:
        id:
          type: integer
          format: int32
          example: 1
        planType:
          type: string
          description: Plan type of the deposit (basic, student, premium).
          example: basic
        balance:
          type: number
          description: Current balance, rounded to cents.
          example: 1000.83
        days:
          type: integer
          format: int32
          description: Number of days since the deposit was opened.
          example: 31
        withdrawals:
          type: array
          items:
            $ref: '#/components/schemas/Withdrawal'
    Withdrawal:
      type: object
      required: [id, amount, date]
      properties:
        id:
          type: integer
          format: int32
          example: 1
        amount:
          type: number
          example: 100.00
        date:
          type: string
          format: date
          example: '2026-01-15'
